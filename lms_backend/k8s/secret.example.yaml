# Template only — DO NOT COMMIT REAL VALUES.
# In production these keys are projected from AWS Secrets Manager via the
# External Secrets Operator; this file documents the expected shape.
apiVersion: v1
kind: Secret
metadata:
  name: lms-backend-secrets
  namespace: lms
  labels:
    app.kubernetes.io/name: lms-backend
type: Opaque
stringData:
  # Must match the RAG chatbot's JWT_SECRET_KEY — that shared secret is what
  # makes SSO between the two services possible.
  SECRET_KEY: "replace-with-32+-byte-random-value"
  DATABASE_URL: "postgresql+asyncpg://lms_app:CHANGE_ME@postgres:5432/meritech_db"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "amqp://guest:CHANGE_ME@rabbitmq:5672//"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  SMTP_HOST: "smtp.example.com"
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "CHANGE_ME"
  STRIPE_API_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-backend
  namespace: lms
  labels:
    app.kubernetes.io/name: lms-backend
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 is what makes the rollout zero-downtime: a new pod
      # must pass its readiness probe before an old one is removed.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lms-backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lms-backend
        app.kubernetes.io/component: api
    spec:
      # Binds the pod to the IRSA role that grants S3, KMS and Secrets
      # Manager access. Without it the attachment presign path has no
      # credentials.
      serviceAccountName: lms-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so losing one node can't take the
      # whole API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lms-backend
              app.kubernetes.io/component: api
      initContainers:
        # Migrations run once per rollout, before any new pod serves traffic.
        - name: migrate
          image: ghcr.io/meritech/lms-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: lms-backend-config
            - secretRef:
                name: lms-backend-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/meritech/lms-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: lms-backend-config
            - secretRef:
                name: lms-backend-secrets
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Checks Postgres; a pod with a broken database is pulled from
            # the Service rather than serving 500s.
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Let the load balancer stop sending traffic before uvicorn
              # starts refusing connections.
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lms-backend
  namespace: lms
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lms-backend
      app.kubernetes.io/component: api

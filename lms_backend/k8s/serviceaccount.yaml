apiVersion: v1
kind: Namespace
metadata:
  name: lms
  labels:
    app.kubernetes.io/name: lms-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lms-backend
  namespace: lms
  labels:
    app.kubernetes.io/name: lms-backend
  annotations:
    # IRSA binding. The role ARN comes from the Terraform stack:
    #   terraform output -raw irsa_role_arn
    # The namespace and this name are baked into the role's trust policy, so
    # renaming either one silently removes the pods' AWS credentials.
    eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/REPLACE_ME-lms-backend"
# Credentials are injected by the EKS pod identity webhook as a projected
# token; no long-lived key material is mounted.
automountServiceAccountToken: true

apiVersion: v1
kind: ConfigMap
metadata:
  name: lms-backend-config
  namespace: lms
  labels:
    app.kubernetes.io/name: lms-backend
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  API_V1_STR: "/api/v1"
  DB_SCHEMA: "lms"
  # Connection pool per pod. Keep (DB_POOL_SIZE + DB_MAX_OVERFLOW) * replicas
  # comfortably under Postgres max_connections, or the HPA will scale the
  # service straight into connection exhaustion.
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "10"
  DB_LOCK_TIMEOUT_MS: "5000"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  ACTION_TOKEN_EXPIRE_HOURS: "72"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_IP: "120"
  RATE_LIMIT_PER_TENANT: "3000"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  ACCRUAL_CHUNK_SIZE: "1000"
  COOKIE_SECURE: "true"
  BACKEND_CORS_ORIGINS: "https://chat.meritech.example,https://leave.meritech.example"
  APP_BASE_URL: "https://leave.meritech.example"
  # Attachment storage. Leave S3_BUCKET empty to disable uploads entirely —
  # the presign endpoint then refuses rather than failing at upload time.
  # Both values come from `terraform output k8s_configmap_additions`.
  S3_BUCKET: ""
  S3_REGION: "us-east-1"
  S3_PRESIGN_EXPIRY_SECONDS: "900"
  MAX_ATTACHMENT_MB: "10"

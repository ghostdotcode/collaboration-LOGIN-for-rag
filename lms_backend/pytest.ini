[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
asyncio_mode = auto
# Session scope for both, so a session-scoped async engine fixture and the
# tests that use it share one event loop (pooled asyncpg connections cannot
# cross loops).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: requires a live PostgreSQL database (LMS_TEST_DATABASE_URL)
    e2e: requires a running API + browser (Playwright)
filterwarnings =
    error::DeprecationWarning:app.*

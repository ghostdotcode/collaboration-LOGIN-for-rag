<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Calendar · Meritech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="lms.css">
  <style>
    /* Calendar grid — scoped here because no other page needs it. */
    .cal-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .cal-month {
      font-size: 15px;
      font-weight: 700;
      min-width: 170px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .cal-dow {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-align: center;
      padding-bottom: 6px;
    }

    .cal-cell {
      min-height: 84px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .cal-cell.outside {
      opacity: 0.35;
    }

    .cal-cell.weekend {
      background: var(--surface-2);
    }

    .cal-cell.today {
      border-color: var(--border-glow);
    }

    .cal-cell.understaffed {
      /* More than half the team off on the same day. */
      border-color: rgba(239, 68, 68, 0.6);
      background: rgba(239, 68, 68, 0.07);
    }

    .cal-date {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .cal-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #0b0e18;
    }

    .cal-chip.tentative {
      /* Pending requests read as provisional, not booked. */
      opacity: 0.62;
      border: 1px dashed rgba(255, 255, 255, 0.5);
    }

    .cal-more {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 12px;
    }

    .legend span::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 6px;
      background: currentColor;
      vertical-align: middle;
    }

    .queue-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }

    .queue-row:last-child {
      border-bottom: none;
    }

    .queue-row input[type='checkbox'] {
      width: 17px;
      height: 17px;
      accent-color: var(--accent-2);
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .cal-cell {
        min-height: 60px;
        padding: 4px;
      }

      .cal-chip {
        font-size: 9.5px;
      }
    }
  </style>
</head>

<body>
  <div class="shell" id="lms-app">
    <header class="lms-header">
      <div class="lms-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="3"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <div class="lms-title">
        <h1>Team Calendar</h1>
        <p>Overlapping absence, at a glance</p>
      </div>
      <nav>
        <a class="nav-link" href="index.html">← Dashboard</a>
        <a class="nav-link primary" href="apply.html">Apply for Leave</a>
      </nav>
    </header>

    <div class="notice" id="page-state" hidden></div>

    <section class="section">
      <div class="cal-toolbar">
        <button class="btn ghost small" id="prev-month" aria-label="Previous month">←</button>
        <div class="cal-month" id="cal-month"></div>
        <button class="btn ghost small" id="next-month" aria-label="Next month">→</button>
        <button class="btn ghost small" id="today-btn">Today</button>
        <span class="hint" id="cal-status" style="color: var(--text-muted);"></span>
      </div>
      <div class="card">
        <div class="cal-grid" id="cal-head"></div>
        <div class="cal-grid" id="cal-grid" style="margin-top: 4px;"></div>
        <div class="legend" id="cal-legend"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Approval queue</h2>
        <span id="queue-count"></span>
      </div>
      <div class="card">
        <div class="actions" style="margin: 0 0 12px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px;">
            <input type="checkbox" id="select-all" style="width: 17px; height: 17px;">
            Select all
          </label>
          <button class="btn small approve" id="bulk-approve" disabled>Approve selected</button>
          <button class="btn small reject" id="bulk-reject" disabled>Reject selected</button>
          <span class="hint" id="bulk-status" style="color: var(--text-muted);"></span>
        </div>
        <div id="queue-list">
          <p class="muted" style="color: var(--text-muted);">Loading…</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Delegate my approvals</h2>
        <span>while you're away</span>
      </div>
      <div class="card">
        <form class="form-grid" id="delegation-form">
          <div class="field">
            <label for="delegate-id">Delegate to</label>
            <select id="delegate-id" required>
              <option value="">Loading…</option>
            </select>
          </div>
          <div class="field">
            <label for="delegate-from">From</label>
            <input type="date" id="delegate-from" required>
          </div>
          <div class="field">
            <label for="delegate-to">Until</label>
            <input type="date" id="delegate-to" required>
          </div>
          <div class="field">
            <label for="delegate-reason">Reason</label>
            <input type="text" id="delegate-reason" maxlength="500" placeholder="Annual leave">
          </div>
        </form>
        <div class="notice error" id="delegation-error" hidden style="margin-top: 14px;"></div>
        <div class="actions">
          <button class="btn small" id="delegate-save">Create delegation</button>
        </div>
        <ul class="list" id="delegation-list" style="margin-top: 8px;"></ul>
      </div>
    </section>
  </div>

  <script src="lms.js"></script>
  <script>
    (function () {
      'use strict';
      const { el, text, show, notice, toast, api, formatDate, formatRange, days, todayISO } = LMS;

      const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const MAX_CHIPS_PER_DAY = 3;
      // A day is flagged when this share of the team is simultaneously off.
      const UNDERSTAFFED_RATIO = 0.5;

      let cursor = new Date();
      cursor.setDate(1);
      let team = [];
      let leaveTypes = {};
      let pending = [];

      function iso(date) {
        const offset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() - offset).toISOString().slice(0, 10);
      }

      function monthLabel(date) {
        return date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      }

      /** Monday-first index, because the working week is Mon-Fri. */
      function mondayIndex(date) {
        return (date.getDay() + 6) % 7;
      }

      function renderHead() {
        const head = el('cal-head');
        head.replaceChildren();
        DOW.forEach(function (label) {
          const cell = document.createElement('div');
          cell.className = 'cal-dow';
          cell.textContent = label;
          head.appendChild(cell);
        });
      }

      function chipFor(request, name) {
        const type = leaveTypes[request.leave_type_id];
        const chip = document.createElement('div');
        chip.className = 'cal-chip' + (request.status === 'pending' ? ' tentative' : '');
        chip.style.background = (type && type.color_hex) || '#6366f1';
        chip.textContent = name.split(' ')[0] +
          (request.status === 'pending' ? ' (?)' : '');
        chip.title = name + ' · ' + ((type && type.name) || 'Leave') +
          ' · ' + formatRange(request.start_date, request.end_date) +
          ' · ' + request.status;
        return chip;
      }

      function renderCalendar(requests, nameById) {
        text(el('cal-month'), monthLabel(cursor));

        // Bucket requests by ISO date once, rather than scanning per cell.
        const byDate = {};
        requests.forEach(function (request) {
          const end = new Date(request.end_date + 'T00:00:00');
          for (
            let day = new Date(request.start_date + 'T00:00:00');
            day <= end;
            day.setDate(day.getDate() + 1)
          ) {
            const key = iso(day);
            (byDate[key] = byDate[key] || []).push(request);
          }
        });

        const grid = el('cal-grid');
        grid.replaceChildren();

        const firstOfMonth = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
        const start = new Date(firstOfMonth);
        start.setDate(start.getDate() - mondayIndex(firstOfMonth));
        const today = todayISO();
        const teamSize = Math.max(team.length, 1);

        for (let i = 0; i < 42; i++) {
          const day = new Date(start);
          day.setDate(start.getDate() + i);
          const key = iso(day);
          const onLeave = byDate[key] || [];

          const cell = document.createElement('div');
          cell.className = 'cal-cell';
          if (day.getMonth() !== cursor.getMonth()) cell.classList.add('outside');
          if (day.getDay() === 0 || day.getDay() === 6) cell.classList.add('weekend');
          if (key === today) cell.classList.add('today');
          if (onLeave.length / teamSize > UNDERSTAFFED_RATIO) {
            cell.classList.add('understaffed');
            cell.title = onLeave.length + ' of ' + teamSize + ' away — check cover';
          }

          const date = document.createElement('div');
          date.className = 'cal-date';
          date.textContent = day.getDate();
          cell.appendChild(date);

          onLeave.slice(0, MAX_CHIPS_PER_DAY).forEach(function (request) {
            cell.appendChild(chipFor(request, nameById[request.user_id] || 'Teammate'));
          });
          if (onLeave.length > MAX_CHIPS_PER_DAY) {
            const more = document.createElement('div');
            more.className = 'cal-more';
            more.textContent = '+' + (onLeave.length - MAX_CHIPS_PER_DAY) + ' more';
            cell.appendChild(more);
          }
          grid.appendChild(cell);
        }

        const legend = el('cal-legend');
        legend.replaceChildren();
        Object.values(leaveTypes).forEach(function (type) {
          const item = document.createElement('span');
          item.style.color = type.color_hex;
          item.textContent = type.name;
          legend.appendChild(item);
        });
        const tentative = document.createElement('span');
        tentative.style.color = 'var(--text-muted)';
        tentative.textContent = '(?) = pending approval';
        legend.appendChild(tentative);
      }

      function renderQueue() {
        const list = el('queue-list');
        list.replaceChildren();
        text(el('queue-count'), pending.length ? pending.length + ' waiting' : 'all clear');

        if (!pending.length) {
          const empty = document.createElement('p');
          empty.style.color = 'var(--text-muted)';
          empty.textContent = 'Nothing is waiting on you.';
          list.appendChild(empty);
          el('bulk-approve').disabled = true;
          el('bulk-reject').disabled = true;
          return;
        }

        pending.forEach(function (request) {
          const row = document.createElement('div');
          row.className = 'queue-row';

          const box = document.createElement('input');
          box.type = 'checkbox';
          box.value = request.id;
          box.className = 'queue-check';
          box.addEventListener('change', updateBulkState);

          const grow = document.createElement('div');
          grow.className = 'grow';
          const who = request.user
            ? request.user.first_name + ' ' + request.user.last_name
            : 'Employee';
          const title = document.createElement('div');
          const type = leaveTypes[request.leave_type_id];
          title.textContent = who + ' · ' + ((type && type.name) || 'Leave') +
            ' · ' + days(request.duration_days);
          const sub = document.createElement('div');
          sub.className = 'muted';
          sub.textContent = formatRange(request.start_date, request.end_date) +
            (request.reason ? ' · ' + request.reason : '') +
            (request.is_retroactive ? ' · backdated' : '');
          grow.append(title, sub);

          const pill = document.createElement('span');
          pill.className = 'pill pending';
          pill.textContent = 'L' + request.current_level;

          row.append(box, grow, pill);
          list.appendChild(row);
        });
        updateBulkState();
      }

      function selectedIds() {
        return Array.from(document.querySelectorAll('.queue-check:checked'))
          .map(function (box) { return box.value; });
      }

      function updateBulkState() {
        const count = selectedIds().length;
        el('bulk-approve').disabled = count === 0;
        el('bulk-reject').disabled = count === 0;
        text(el('bulk-status'), count ? count + ' selected' : '');
      }

      async function bulkDecide(decision) {
        const ids = selectedIds();
        if (!ids.length) return;

        let comment = null;
        if (decision === 'reject') {
          comment = prompt('Reason for rejecting ' + ids.length + ' request(s):');
          if (!comment) return;
        }

        el('bulk-approve').disabled = true;
        el('bulk-reject').disabled = true;
        text(el('bulk-status'), 'Processing ' + ids.length + '…');

        try {
          // Each row is decided in its own transaction server-side, so a
          // single stale request does not sink the whole batch.
          const result = await api('/approvals/bulk', {
            method: 'POST',
            body: { request_ids: ids, decision: decision, comment: comment },
          });
          toast(result.succeeded + ' of ' + result.processed + ' processed.');

          const failures = result.results.filter(function (row) { return !row.succeeded; });
          if (failures.length) {
            notice(
              el('page-state'),
              failures.length + ' request(s) could not be ' + decision + 'd: ' +
              failures.map(function (row) { return row.message; }).join(' · '),
              'warn'
            );
          } else {
            notice(el('page-state'), '', null);
          }
          await load();
        } catch (error) {
          notice(el('page-state'), error.message, 'error');
        } finally {
          updateBulkState();
        }
      }

      async function renderDelegations() {
        const select = el('delegate-id');
        select.replaceChildren();
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = team.length ? 'Choose a colleague…' : 'No direct reports';
        select.appendChild(placeholder);
        team.forEach(function (member) {
          const option = document.createElement('option');
          option.value = member.id;
          option.textContent = member.first_name + ' ' + member.last_name;
          select.appendChild(option);
        });

        const list = el('delegation-list');
        list.replaceChildren();
        let delegations = [];
        try {
          delegations = (await api('/approvals/delegations')) || [];
        } catch (error) {
          return;
        }
        delegations.forEach(function (delegation) {
          const li = document.createElement('li');
          const grow = document.createElement('div');
          grow.className = 'grow';
          const who = team.find(function (m) { return m.id === delegation.delegate_id; });
          grow.textContent =
            (who ? who.first_name + ' ' + who.last_name : 'Colleague') + ' · ' +
            formatRange(delegation.starts_on, delegation.ends_on);

          const remove = document.createElement('button');
          remove.className = 'btn small ghost';
          remove.textContent = 'Revoke';
          remove.addEventListener('click', async function () {
            remove.disabled = true;
            try {
              await api('/approvals/delegations/' + delegation.id, { method: 'DELETE' });
              toast('Delegation revoked.');
              renderDelegations();
            } catch (error) {
              toast(error.message);
              remove.disabled = false;
            }
          });
          li.append(grow, remove);
          list.appendChild(li);
        });
      }

      el('delegate-save').addEventListener('click', async function () {
        const errorBox = el('delegation-error');
        const delegate = el('delegate-id').value;
        const from = el('delegate-from').value;
        const to = el('delegate-to').value;

        if (!delegate || !from || !to) {
          notice(errorBox, 'Choose a colleague and both dates.', 'error');
          return;
        }
        if (to < from) {
          notice(errorBox, 'The end date cannot be before the start date.', 'error');
          return;
        }
        notice(errorBox, '', null);

        try {
          await api('/approvals/delegations', {
            method: 'POST',
            body: {
              delegate_id: delegate,
              starts_on: from,
              ends_on: to,
              reason: el('delegate-reason').value.trim() || null,
            },
          });
          toast('Delegation created.');
          el('delegation-form').reset();
          renderDelegations();
        } catch (error) {
          notice(errorBox, error.message, 'error');
        }
      });

      async function load() {
        const monthStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
        const from = new Date(monthStart);
        from.setDate(from.getDate() - 7);
        const to = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 7);

        text(el('cal-status'), 'Loading…');
        // Draw the month before fetching anything. An empty grid is still a
        // usable calendar; a blank panel because the API is down is not.
        renderCalendar([], {});

        try {
          const [types, reports, queue] = await Promise.all([
            api('/leave-types'),
            api('/users/me/team'),
            api('/approvals/pending').catch(function () { return []; }),
          ]);

          leaveTypes = {};
          (types || []).forEach(function (type) { leaveTypes[type.id] = type; });
          team = reports || [];
          pending = queue || [];

          const nameById = {};
          team.forEach(function (member) {
            nameById[member.id] = member.first_name + ' ' + member.last_name;
          });

          // One request per teammate keeps the payload small and respects the
          // per-user authorisation the API enforces.
          const perMember = await Promise.all(
            team.map(function (member) {
              return api(
                '/leaves?mine=false&user_id=' + member.id +
                '&status=pending&status=approved' +
                '&start_from=' + iso(from) + '&start_to=' + iso(to) +
                '&page_size=200'
              ).catch(function () { return { items: [] }; });
            })
          );
          const requests = perMember.reduce(function (all, page) {
            return all.concat(page.items || []);
          }, []);

          text(el('cal-status'), team.length + ' direct report(s)');
          renderCalendar(requests, nameById);
          renderQueue();
          renderDelegations();
          notice(el('page-state'), '', null);
        } catch (error) {
          text(el('cal-status'), '');
          notice(
            el('page-state'),
            error.code === 'no_session'
              ? 'Please sign in to the HR assistant first, then reopen the leave portal.'
              : error.message,
            'error'
          );
        }
      }

      el('prev-month').addEventListener('click', function () {
        cursor.setMonth(cursor.getMonth() - 1);
        load();
      });
      el('next-month').addEventListener('click', function () {
        cursor.setMonth(cursor.getMonth() + 1);
        load();
      });
      el('today-btn').addEventListener('click', function () {
        cursor = new Date();
        cursor.setDate(1);
        load();
      });
      el('select-all').addEventListener('change', function (event) {
        document.querySelectorAll('.queue-check').forEach(function (box) {
          box.checked = event.target.checked;
        });
        updateBulkState();
      });
      el('bulk-approve').addEventListener('click', function () { bulkDecide('approve'); });
      el('bulk-reject').addEventListener('click', function () { bulkDecide('reject'); });

      renderHead();
      load();
    })();
  </script>
</body>

</html>
